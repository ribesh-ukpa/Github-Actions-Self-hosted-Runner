name: Deploy to Azure VM (Self-Hosted Runner)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  APP_DIR: /var/www/dummy-app
  NODE_ENV: production

jobs:
  # ── Job 1: Run tests on GitHub-hosted runner ───────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # FIX 1: removed cache: "npm" — requires package-lock.json to exist
          # if you have package-lock.json committed, you can re-add it

      - name: Install dependencies
        run: npm install   # FIX 2: use npm install instead of npm ci (installs ALL deps including jest)

      - name: Run tests
        run: npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ── Job 2: Deploy on self-hosted runner ────────────────────────────────────
  deploy:
    name: Deploy to Azure VM
    runs-on: [self-hosted, linux]   # FIX 3: use labels that match your actual runner
    needs: test
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Ensure app directory exists and is a git repo ─────────────────────
      - name: Setup app directory
        run: |
          if [ ! -d "${{ env.APP_DIR }}" ]; then
            echo "📁 Creating app directory..."
            sudo mkdir -p ${{ env.APP_DIR }}
            sudo chown $USER:$USER ${{ env.APP_DIR }}
            git clone ${{ github.server_url }}/${{ github.repository }}.git ${{ env.APP_DIR }}
          fi

      # ── Pull latest code ──────────────────────────────────────────────────
      - name: Pull latest code
        run: |
          cd ${{ env.APP_DIR }}
          git fetch origin main
          git reset --hard origin/main
          echo "✅ Code updated to commit: $(git rev-parse --short HEAD)"

      # ── Install only production dependencies ─────────────────────────────
      - name: Install production dependencies
        run: |
          cd ${{ env.APP_DIR }}
          npm install --omit=dev   # FIX 4: npm install instead of npm ci (no lockfile needed)
          echo "✅ Dependencies installed"

      # ── Write .env file ───────────────────────────────────────────────────
      - name: Write .env file
        run: |
          cd ${{ env.APP_DIR }}
          # FIX 5: corrected the APP_VERSION — previous version had a bug with pipe + redirect
          cat > .env << ENVEOF
          APP_VERSION=$(echo "${{ github.sha }}" | cut -c1-7)
          NODE_ENV=production
          PORT=3000
          ENVEOF
          echo "✅ .env written"

      # ── Check PM2 is installed ────────────────────────────────────────────
      - name: Ensure PM2 is installed
        run: |
          if ! command -v pm2 &> /dev/null; then
            echo "📦 Installing PM2..."
            npm install -g pm2
          fi
          pm2 --version

      # ── Restart app via PM2 ───────────────────────────────────────────────
      - name: Restart app with PM2
        run: |
          cd ${{ env.APP_DIR }}
          if pm2 describe dummy-app > /dev/null 2>&1; then
            pm2 reload dummy-app --update-env
            echo "✅ App reloaded via PM2"
          else
            pm2 start src/app.js \
              --name dummy-app \
              --env production \
              --max-memory-restart 300M \
              --restart-delay 3000
            pm2 save
            echo "✅ App started fresh via PM2"
          fi

      # ── Health check ──────────────────────────────────────────────────────
      - name: Health check
        run: |
          echo "Waiting for app to start..."
          sleep 5

          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed (attempt $i)"
              curl -s http://localhost:3000/health | python3 -m json.tool
              exit 0
            fi
            echo "⏳ Attempt $i failed (HTTP $STATUS), retrying in 5s..."
            sleep 5
          done

          echo "❌ Health check failed after 5 attempts"
          pm2 logs dummy-app --lines 50
          exit 1

      # ── Deployment summary ────────────────────────────────────────────────
      - name: Deployment summary
        if: success()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅ DEPLOYMENT SUCCESSFUL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Commit : ${{ github.sha }}"
          echo "  Branch : ${{ github.ref_name }}"
          echo "  Actor  : ${{ github.actor }}"
          echo "  Time   : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          pm2 status dummy-app

      # ── Rollback on failure ───────────────────────────────────────────────
      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed — attempting rollback..."
          cd ${{ env.APP_DIR }}
          git reset --hard HEAD~1
          npm install --omit=dev
          pm2 reload dummy-app --update-env
          echo "⚠️  Rolled back to: $(git rev-parse --short HEAD)"

  # ── Job 3: Notify team ─────────────────────────────────────────────────────
  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Notify success
        if: needs.deploy.result == 'success'
        run: |
          echo "📢 Deployment successful!"
          # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          #   -H 'Content-type: application/json' \
          #   --data '{"text":"✅ dummy-app deployed by ${{ github.actor }}"}'

      - name: Notify failure
        if: needs.deploy.result == 'failure'
        run: |
          echo "📢 Deployment FAILED!"
          # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          #   -H 'Content-type: application/json' \
          #   --data '{"text":"❌ dummy-app deploy FAILED on ${{ github.sha }}"}'