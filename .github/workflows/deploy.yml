name: Deploy to Azure VM (Self-Hosted Runner)

on:
  push:
    branches:
      - main          # Auto-deploy on merge to main
  workflow_dispatch:  # Allow manual trigger from GitHub UI

# Prevent multiple deployments running at the same time
concurrency:
  group: production-deploy
  cancel-in-progress: false   # Wait for in-progress deploy, don't cancel it

env:
  APP_DIR: /var/www/dummy-app  # Directory on your Azure VM where app lives
  NODE_ENV: production

jobs:
  # ── Job 1: Run tests on GitHub-hosted runner (fast, cheap) ─────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest   # GitHub-hosted is fine for tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ── Job 2: Deploy on self-hosted runner (has access to Azure VM directly) ──
  deploy:
    name: Deploy to Azure VM
    runs-on: [self-hosted, azure, prod]   # Targets your self-hosted runner by labels
    needs: test                           # Only runs if tests pass
    environment: production               # Requires manual approval if configured in GitHub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Pull latest code into app directory ──────────────────────────────
      - name: Pull latest code
        run: |
          cd ${{ env.APP_DIR }}
          git fetch origin main
          git reset --hard origin/main
          echo "✅ Code updated to commit: $(git rev-parse --short HEAD)"

      # ── Install only production dependencies ─────────────────────────────
      - name: Install production dependencies
        run: |
          cd ${{ env.APP_DIR }}
          npm ci --omit=dev
          echo "✅ Dependencies installed"

      # ── Set the app version from git commit sha ───────────────────────────
      - name: Set app version
        run: |
          cd ${{ env.APP_DIR }}
          echo "APP_VERSION=${{ github.sha }}" | cut -c1-7 >> .env
          echo "NODE_ENV=production" >> .env
          echo "PORT=3000" >> .env

      # ── Restart the app via PM2 (zero-downtime reload) ────────────────────
      - name: Restart app with PM2
        run: |
          cd ${{ env.APP_DIR }}

          # If app is already registered with PM2, reload it (zero downtime)
          # Otherwise start it fresh
          if pm2 describe dummy-app > /dev/null 2>&1; then
            pm2 reload dummy-app --update-env
            echo "✅ App reloaded via PM2"
          else
            pm2 start src/app.js \
              --name dummy-app \
              --env production \
              --max-memory-restart 300M \
              --restart-delay 3000
            pm2 save
            echo "✅ App started fresh via PM2"
          fi

      # ── Health check: wait for app to come back up ────────────────────────
      - name: Health check
        run: |
          echo "Waiting for app to start..."
          sleep 5

          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed (attempt $i)"
              curl -s http://localhost:3000/health | python3 -m json.tool
              exit 0
            fi
            echo "⏳ Attempt $i failed (HTTP $STATUS), retrying in 5s..."
            sleep 5
          done

          echo "❌ Health check failed after 5 attempts"
          pm2 logs dummy-app --lines 50
          exit 1

      # ── Print deployment summary ──────────────────────────────────────────
      - name: Deployment summary
        if: success()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅ DEPLOYMENT SUCCESSFUL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Commit : ${{ github.sha }}"
          echo "  Branch : ${{ github.ref_name }}"
          echo "  Actor  : ${{ github.actor }}"
          echo "  Time   : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          pm2 status dummy-app

      # ── Rollback on failure ───────────────────────────────────────────────
      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed — attempting rollback..."
          cd ${{ env.APP_DIR }}

          # Go back one commit
          git reset --hard HEAD~1
          npm ci --omit=dev
          pm2 reload dummy-app --update-env

          echo "⚠️  Rolled back to: $(git rev-parse --short HEAD)"

  # ── Job 3: Notify team (optional) ─────────────────────────────────────────
  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: deploy
    if: always()   # Always run, even if deploy failed

    steps:
      - name: Notify success
        if: needs.deploy.result == 'success'
        run: |
          echo "📢 Would send Slack/Teams notification: Deployment successful!"
          # Uncomment and configure for real notifications:
          # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          #   -H 'Content-type: application/json' \
          #   --data '{"text":"✅ dummy-app deployed successfully by ${{ github.actor }}"}'

      - name: Notify failure
        if: needs.deploy.result == 'failure'
        run: |
          echo "📢 Would send Slack/Teams notification: Deployment FAILED!"
          # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          #   -H 'Content-type: application/json' \
          #   --data '{"text":"❌ dummy-app deployment FAILED on commit ${{ github.sha }}"}'